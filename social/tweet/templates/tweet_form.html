{% extends "layout.html" %}

{% block title %}
tweet
{% endblock %}

{% block content %}
<h1 class='text-center'>Welcome to my social</h1>
<h2>
    {% if form.instance.pk  %}
    Edit tweet
    {% else %}
    Create Tweet
    {% endif %}
</h2>
<form  method="post" enctype='multipart/form-data' class='form'>
    {% csrf_token %}
    {{form.as_p}}
    <button class="btn btn-warning" type='submit'> Submit</button>
</form>
<a href="{% url "tweet_list" %}"> Back to Tweet</a>
{% endblock %}
